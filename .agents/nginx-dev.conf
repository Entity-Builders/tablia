# Nginx configuration for dev.tablia.io
# Serves the Vite React SPA from the dist/ directory
# The try_files directive is CRITICAL for React Router to work (client-side routing)
#
# Usage on VPS:
#   sudo cp tablia-dev.nginx.conf /etc/nginx/sites-available/dev.tablia.io
#   sudo ln -s /etc/nginx/sites-available/dev.tablia.io /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get SSL cert with Let's Encrypt:
#   sudo certbot --nginx -d dev.tablia.io

server {
    listen 80;
    server_name dev.tablia.io;

    # Redirect HTTP → HTTPS (certbot will add this)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.tablia.io;

    # --- SSL (managed by certbot / Let's Encrypt) ---
    # ssl_certificate     /etc/letsencrypt/live/dev.tablia.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.tablia.io/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Root: path where rsync deploys the dist/ folder ---
    root /var/www/dev-tablia;
    index index.html;

    # --- React Router SPA fix ---
    # All routes fall back to index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache static assets aggressively ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # --- Gzip compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
